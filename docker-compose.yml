version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: farm-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: the-farm-dashboard
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok'
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: farm-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/the-farm-dashboard
      NODE_ENV: development
    volumes:
      - ./server:/app/server
      - ./frontend:/app/frontend
    depends_on:
      mongo:
        condition: service_healthy
    command: npm run dev

volumes:
  mongo-data:
